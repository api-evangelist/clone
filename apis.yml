aid: clone
name: Clone
description: >-
  Clone Robotics develops musculoskeletal, intelligent humanoid androids and
  robotic hands built on Myofiber, its artificial-muscle technology pioneered in
  2021, driven by water-based hydraulics and biomimetic joints. Its flagship
  Clone Alpha is a full-body biomimetic humanoid with synthetic organs; the
  Clone Hand is its foundational dexterous-manipulation platform. The developer
  surface is a first-party Python client (clone_client) exposing a high-level
  gRPC (proto3) API to directly control the Clone Robot over the local network —
  actuating muscles via impulses/pulses/pressures, driving pinch and hydra
  valves, managing the water-pump pressure source, streaming IMU/pose/joint
  telemetry, and configuring cameras. There is no public HTTP/REST API or hosted
  endpoint; control is LAN-scoped gRPC discovered over zeroconf/mDNS by robot
  name or IP. Co-founded 2021 by Dhanush Radhakrishna and Lukasz Kozlik.
